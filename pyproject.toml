[project]
name = "sofia-asistente"
version = "0.2.0"
description = "Control del ratón con la mano o la cabeza (MediaPipe) y asistente de voz con Gemini, para personas con poca movilidad en las manos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mediapipe>=0.10.14",
  "opencv-python>=4.9",
  "numpy",
  "certifi",
  "pynput; sys_platform != 'darwin'",
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices; sys_platform == 'darwin'",
  "google-genai>=1.50",
  "vosk>=0.3.44",
  "sounddevice>=0.4.6",
]

[project.scripts]
sofia = "sofia.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sofia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
